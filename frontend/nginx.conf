# App ElERP: sirve la SPA en /app y proxya /api,/auth al backend y /papi,/consola a
# la plataforma. Un solo origen para que las cookies de sesión viajen sin CORS.
# El SITIO público (/, /docs, /legal, /assets) lo sirve el contenedor doc-elerp;
# Nginx Proxy Manager enruta por ruta (ver el README del repo).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://elerp-backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /auth/ {
    proxy_pass http://elerp-backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Consola de super usuario (plataforma). El BFF (elerp-platform:8090) sirve el SPA
  # con base=/consola y su API en /papi. Cookies same-origin (sin CORS).
  location /papi/ {
    proxy_pass http://elerp-platform:8090;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location = /consola { return 301 /consola/; }
  location /consola/ {
    proxy_pass http://elerp-platform:8090;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Assets de la app (Vite): nombres con hash → inmutables, caché larga.
  location /app/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # App ERP (SPA con base=/app/). El HTML no se cachea: revalida en cada carga.
  location /app {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /app/index.html;
  }

  # Cualquier otra ruta que llegue a este contenedor (no debería, NPM la enruta al
  # sitio) redirige a la app.
  location = / { return 302 /app/; }
  location / { return 404; }
}
