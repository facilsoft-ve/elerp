# App ElERP: sirve la SPA en /app y proxya /api,/auth al backend y /papi,/consola a
# la plataforma. Un solo origen para que las cookies de sesión viajen sin CORS.
# El SITIO público (/, /docs, /legal, /assets) lo sirve el contenedor doc-elerp;
# Nginx Proxy Manager enruta por ruta (ver el README del repo).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Quién puede EMBEBER la app en un frame/WebView. Hasta ahora funcionaba por AUSENCIA
  # de header (sin X-Frame-Options ni CSP, el navegador permite el frame); declararlo lo
  # vuelve explícito y de paso bloquea el clickjacking desde cualquier otro sitio.
  #
  # Se usa CSP frame-ancestors y NO X-Frame-Options a propósito: XFO solo sabe decir
  # "nadie" o "mismo origen" (su ALLOW-FROM está muerto), así que no puede expresar una
  # lista de permitidos. `*.hubmy.app` cubre app./dev. sin abrir a terceros.
  #
  # OJO: esto NO es CORS. `Access-Control-Allow-Origin` decide si JavaScript de otro
  # origen puede LEER una respuesta; quien decide si la página se puede MOSTRAR dentro de
  # un frame es este header. Y `ACAO: *` es incompatible con cookies por especificación,
  # así que no serviría para una app con sesión como esta.
  set $csp_frames "frame-ancestors 'self' https://*.hubmy.app";
  add_header Content-Security-Policy $csp_frames always;

  location /api/ {
    proxy_pass http://elerp-backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /auth/ {
    proxy_pass http://elerp-backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Consola de super usuario (plataforma). El BFF (elerp-platform:8090) sirve el SPA
  # con base=/consola y su API en /papi. Cookies same-origin (sin CORS).
  location /papi/ {
    proxy_pass http://elerp-platform:8090;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location = /consola { return 301 /consola/; }
  location /consola/ {
    proxy_pass http://elerp-platform:8090;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Assets de la app (Vite): nombres con hash → inmutables, caché larga.
  location /app/assets/ {
    # Repetido a propósito: al declarar add_header acá, nginx NO hereda los del server.
    add_header Content-Security-Policy $csp_frames always;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # App ERP (SPA con base=/app/). El HTML no se cachea: revalida en cada carga.
  location /app {
    # Idem: sin esta línea el CSP del server no llega al HTML de la app, que es
    # justamente el documento que Hubmy embebe.
    add_header Content-Security-Policy $csp_frames always;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /app/index.html;
  }

  # Sitio público (landing en /, docs en /docs, legal en /legal, assets en
  # /assets): el CONTENIDO vive en el repo doc-elerp y lo sirve el contenedor
  # `elerp-site`. Este frontend actúa de PUERTA: proxya esas rutas al sitio, así el
  # despliegue funciona con un solo origen sin depender de reglas de ruta en Nginx
  # Proxy Manager. (Opcional: en NPM se puede enrutar / y /docs directo a
  # elerp-site y dejar /app,/api,/auth,/papi,/consola a este contenedor.)
  location / {
    proxy_pass http://elerp-site:80;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
